name: Test
'on':
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Every environment runs to its end, so that one failure does not hide the results of the others
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v7

      # Comes before the install, because the script install of package.json compiles the binding for the running Node
      - name: Use Node.js ${{ matrix.node-version }}
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # node-gyp unpacks the headers of Node on every install, 42-44 s on the Windows runners
      - name: Cache the headers of Node for node-gyp
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/node-gyp
          key: node-gyp-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}

      # node-gyp skips its search for Visual Studio, 10 s on windows-latest and 65 s on windows-11-arm, where VCINSTALLDIR
      # of a developer environment names the installation
      - name: Visual Studio developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      # After a change of pnpm-lock.yaml its cache restores the latest store of this system and architecture, so that pnpm
      # downloads exclusively the changed packages, while cache: pnpm of setup-node restores exclusively by the exact hash;
      # after the job it prunes the store and saves it under the new hash
      - name: Install pnpm and dependencies
        uses: pnpm/action-setup@v6
        env:
          # The folder where node-gyp keeps the headers of Node, cached by the step above
          npm_config_devdir: ${{ runner.temp }}/node-gyp
        with:
          version: 10
          cache: true
          run_install: |
            args: [--frozen-lockfile]

      - name: Check
        shell: bash
        run: |
          pnpm run check

      - name: Tests
        shell: bash
        run: |
          pnpm run test:all
