name: Test
'on':
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Every environment runs to its end, so that one failure does not hide the results of the others
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v7

      # Comes before the install, because the script install of package.json compiles the binding for the running Node
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # After a change of pnpm-lock.yaml its cache restores the latest store of this system and architecture, so that pnpm
      # downloads exclusively the changed packages, while cache: pnpm of setup-node restores exclusively by the exact hash;
      # after the job it prunes the store and saves it under the new hash
      - name: Install pnpm and dependencies
        uses: pnpm/action-setup@v6
        with:
          version: 10
          cache: true
          run_install: |
            args: [--frozen-lockfile]

      - name: Check
        shell: bash
        run: |
          pnpm run check

      - name: Tests
        shell: bash
        run: |
          pnpm run test:all
