name: Test
'on':
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Every environment runs to its end, so that one failure does not hide the results of the others
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v7

      # from: https://github.com/actions/setup-node/blob/main/docs/advanced-usage.md#caching-packages-data
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Build
        shell: bash
        run: |
          pnpm run build

      - name: Lint
        shell: bash
        run: |
          pnpm run audit
          pnpm run lint
          pnpm run check:types

      - name: Mocha tests
        shell: bash
        run: |
          pnpm run test:mocha:ci
