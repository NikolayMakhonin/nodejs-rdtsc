name: Test
'on':
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'
  workflow_dispatch:
    inputs:
      runners:
        description: JSON array of the runners to test on
        default: '["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest", "windows-11-arm", "macos-latest", "macos-15-intel"]'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Every environment runs to its end, so that one failure does not hide the results of the others
      fail-fast: false
      matrix:
        # During the move to the standard of simple-utils a push tests exclusively macos-latest, so that a run ends sooner:
        # it differs most from the Windows x64 of development and failed the most tests in the first run of all runners.
        # A change of the binding or of what depends on the platform or on a version of Node that development lacks gets
        # a run by hand, by default on all runners
        os: ${{ fromJSON(inputs.runners || '["macos-latest"]') }}
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v7

      # Comes before the install, because the script install of package.json compiles the binding for the running Node
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # After a change of pnpm-lock.yaml its cache restores the latest store of this system and architecture, so that pnpm
      # downloads exclusively the changed packages, while cache: pnpm of setup-node restores exclusively by the exact hash;
      # after the job it prunes the store and saves it under the new hash
      - name: Install pnpm and dependencies
        uses: pnpm/action-setup@v6
        with:
          version: 10
          cache: true
          run_install: |
            args: [--frozen-lockfile]

      - name: Check
        shell: bash
        run: |
          pnpm run check

      - name: Tests
        shell: bash
        run: |
          pnpm run test:all
